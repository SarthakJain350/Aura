<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Adaptive Unified Response Assistant</title>
    
    <script>
        window.onerror = function(msg, src, line, col, err) {
            console.error('[GLOBAL ERROR]', msg, 'at', src, line, col);
            document.head.innerHTML = '';
            document.body.innerHTML = `
                <div style="background:#030712;color:#22d3ee;font-family:monospace;padding:40px;min-height:100vh">
                <h1 style="color:#f87171">⚠ AURA Error</h1>
                <p style="color:white">${msg}</p>
                <p style="color:#6b7280">File: ${src} Line: ${line}</p>
                <br/>
                <button onclick="location.reload()" 
                    style="background:#0e7490;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:16px">
                    Restart AURA
                </button>
                <button onclick="localStorage.clear();location.reload()" 
                    style="background:#7f1d1d;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:16px;margin-left:12px">
                    Clear Data and Restart
                </button>
                </div>
            `;
            return true;
        };
        if (window.location.protocol === 'file:') {
            document.write('<div style="color:cyan; font-family:monospace; padding:40px; background:#030712; height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; position:absolute; top:0; left:0; width:100%; z-index:99999;"><h1>⚠️ AURA cannot run as a file</h1><p>Please start AURA properly using the terminal command below:</p><code style="background:#111; padding:10px 20px; border-radius:8px; font-size:18px; color:#22d3ee">python start.py</code><p>Then open Chrome and go to: <a href="http://127.0.0.1:8888" style="color:#22d3ee">http://127.0.0.1:8888</a></p></div>');
        }
    </script>
    
    <!-- 
       PROTOTYPE WARNING: 
       We are using Babel standalone via CDN for raw JSX transformation in the browser.
       For a production deployment, replace this with a proper Vite/Webpack build step! 
    -->
    <!-- TensorFlow JS -->
    <script async src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts for Onboarding UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/components/AuraUI.css">

    <!-- UI/CSS Layer -->
    <style>
        body { 
            margin: 0; 
            background-color: #030712; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
        }
        #root { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Shared State & Services Setup (Vanilla JS) -->
    <script src="./src/secrets.js"></script>
    <script src="./src/config.js"></script>
    <script src="./src/services/SpeechService.js"></script>
    <!-- Load order: config → SpeechService → MoodDetector → ProfileService → SpotifyService → AIEngine → React components → App -->
    <script src="./src/services/MoodDetector.js"></script>
    <script src="./src/services/ProfileService.js"></script>
    <script src="./src/services/SpotifyService.js"></script>
    <script src="./src/services/AIEngine.js"></script>

    <!-- React Components -->
    <script type="text/babel" src="./src/components/WaveVisualizer.jsx"></script>
    <script type="text/babel" src="./src/components/profile/ProfileTracker.jsx"></script>
    <script type="text/babel" src="./src/components/Onboarding.jsx"></script>
    <script type="text/babel" src="./src/components/AuraUI.jsx"></script>

    <!-- Main Entry Orchestrator -->
    <script type="text/babel" src="./src/App.jsx"></script>
</body>
</html>
